# LEGACY — Ancienne configuration Render (remplacée par Railway + railway.toml).
# Conservé pour référence. Ne pas utiliser pour un déploiement actif.
services:
  - type: web
    name: luciole
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false          # à renseigner manuellement dans le dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://luciole.onrender.com
